plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

def keystorePropsFile = rootProject.file('keystore.properties')
def hasSigning = keystorePropsFile.exists()
def keystoreProps = new Properties()
if (hasSigning) {
    keystoreProps.load(keystorePropsFile.newInputStream())
}

android {
    namespace 'com.silastali.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.silastali.app"
        minSdk 24
        targetSdk 36
        versionCode 67
        versionName "1.2.23"
    }

    flavorDimensions 'dist'
    productFlavors {
        apk {
            dimension 'dist'
            buildConfigField 'boolean', 'ENABLE_AUTO_UPDATE', 'true'
        }
        play {
            dimension 'dist'
            buildConfigField 'boolean', 'ENABLE_AUTO_UPDATE', 'false'
        }
    }

    signingConfigs {
        release {
            if (hasSigning) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
        sideload {
            storeFile file(System.getProperty("user.home") + File.separator + ".android" + File.separator + "debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
        sideload {
            initWith release
            signingConfig signingConfigs.sideload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity-ktx:1.8.2'

    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    implementation 'com.google.mlkit:barcode-scanning:17.2.0'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'
}